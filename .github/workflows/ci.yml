name: DataOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt-ci:
    name: dbt compile + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instala dependencias
        run: pip install -r requirements.txt

      - name: Genera datos de prueba
        run: python3 ci/generate_test_data.py

      - name: dbt compile
        working-directory: dbt_project/ecommerce
        run: dbt compile --profiles-dir .

      - name: dbt run
        working-directory: dbt_project/ecommerce
        run: dbt run --profiles-dir .

      - name: dbt test
        working-directory: dbt_project/ecommerce
        run: dbt test --profiles-dir .

  python-ci:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instala dependencias
        run: pip install -r requirements.txt

      - name: Genera datos de prueba
        run: python3 ci/generate_test_data.py

      - name: Corre tests unitarios
        run: pytest tests/ -v --tb=short
